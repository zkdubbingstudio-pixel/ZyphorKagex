<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitsu Player - ZK Dubbing</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0d0f17;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .player-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        iframe, video {
            width: 100%;
            height: 100%;
            border: none;
        }
        .error-msg {
            color: #ff4d4d;
            background: rgba(20, 20, 20, 0.9);
            padding: 15px 25px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div class="player-container" id="playerContainer">
        <div class="error-msg" id="statusMsg">Video load ho raha hai...</div>
    </div>

    <script>
        async function loadVideo() {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            const container = document.getElementById('playerContainer');
            const statusMsg = document.getElementById('statusMsg');

            if (!token) {
                statusMsg.innerText = "❌ Invalid Link / Token Missing!";
                return;
            }

            try {
                const res = await fetch(`/api/validate-token?token=${token}`);
                const data = await res.json();

                if (data.success && data.video_url) {
                    let videoUrl = data.video_url;

                    if (videoUrl.includes('player.abyssplayer.com') || videoUrl.includes('embed') || videoUrl.includes('iframe')) {
                        container.innerHTML = `<iframe src="${videoUrl}" allowfullscreen allow="autoplay"></iframe>`;
                    } else {
                        container.innerHTML = `
                            <video controls autoplay name="media">
                                <source src="${videoUrl}" type="video/mp4">
                            </video>`;
                    }
                } else {
                    statusMsg.innerText = data.message || "❌ Link expired or usage limit exceeded!";
                }
            } catch (err) {
                console.error(err);
                statusMsg.innerText = "❌ Network Error or Invalid Token!";
            }
        }

        loadVideo();
    </script>
</body>
</html>
