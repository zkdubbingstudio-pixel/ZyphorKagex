<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kitsu Player - ZK Dubbing Studio</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #ffffff;
            font-family: Arial, sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        /* Top Navbar with Logo & Name */
        .header-bar {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            background: #1a1a1a;
            border-bottom: 1px solid #333;
            flex-shrink: 0;
            z-index: 10;
        }
        .header-bar img {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 8px;
        }
        .header-bar span {
            font-size: 15px;
            font-weight: bold;
            color: #ffcc00;
        }

        /* Video Container */
        .player-container {
            position: relative;
            width: 100%;
            flex-grow: 1;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        iframe, video {
            width: 100%;
            height: 100%;
            border: none;
            object-fit: contain;
        }

        /* Low Brightness Anti-Piracy Floating Watermark */
        #watermark {
            position: absolute;
            color: rgba(255, 255, 255, 0.15);
            font-size: 13px;
            font-weight: bold;
            pointer-events: none;
            z-index: 999;
            transition: all 2s ease-in-out;
            text-shadow: 1px 1px 1px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <!-- Top Header with Logo and Studio Name -->
    <div class="header-bar">
        <img src="https://i.ibb.co/2Yp3CDq9/file-000000006f2c8211b20c6bedc9f9ac12.png" alt="ZK Logo">
        <span>ZK Dubbing Studio</span>
    </div>

    <!-- Video Player Container -->
    <div class="player-container" id="playerContainer">
        <div id="watermark">ID: Loading...</div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const container = document.getElementById('playerContainer');

        if (!token) {
            container.innerHTML = "<h2 style='text-align:center; margin-top:50px; color:red;'>⚠️ Invalid or Expired Link!</h2>";
        } else {
            fetch(`https://zyphorkagex.onrender.com/api/verify-token?token=${token}`)
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        const videoUrl = data.videoUrl;
                        const userId = data.userId || "Protected";
                        
                        // Watermark text set karna
                        const watermark = document.getElementById('watermark');
                        watermark.innerText = `ID: ${userId} | ZK Dubbing`;

                        // Iframe with full permissions for fullscreen support
                        if (videoUrl.includes('abyssplayer.com') || videoUrl.includes('embed') || videoUrl.includes('iframe')) {
                            container.innerHTML += `<iframe src="${videoUrl}" allow="fullscreen; autoplay; encrypted-media; picture-in-picture" allowfullscreen webkitallowfullscreen mozallowfullscreen></iframe>`;
                        } else {
                            container.innerHTML += `<video id="videoPlayer" src="${videoUrl}" controls controlsList="nodownload" disablePictureInPicture playsinline webkit-playsinline></video>`;
                        }

                        // Watermark ko screen par random move karwana
                        setInterval(() => {
                            const maxX = container.clientWidth - 150;
                            const maxY = container.clientHeight - 40;
                            const randomX = Math.floor(Math.random() * maxX);
                            const randomY = Math.floor(Math.random() * maxY);
                            watermark.style.left = `${Math.max(10, randomX)}px`;
                            watermark.style.top = `${Math.max(10, randomY)}px`;
                        }, 4000);

                    } else {
                        container.innerHTML = `<h2 style='text-align:center; margin-top:50px; color:red;'>❌ ${data.message || 'Link expired!'}</h2>`;
                    }
                })
                .catch(err => {
                    container.innerHTML = "<h2 style='text-align:center; margin-top:50px; color:red;'>❌ Server Error!</h2>";
                });
        }
    </script>
</body>
</html>
