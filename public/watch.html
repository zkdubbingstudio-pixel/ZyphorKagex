<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitsu Player - ZK Dubbing Studio</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f0f0f;
            color: #ffffff;
            font-family: Arial, sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Top Navbar with Logo & Name */
        .header-bar {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            background: #1a1a1a;
            border-bottom: 1px solid #333;
            position: relative;
            z-index: 10;
        }
        .header-bar img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 10px;
        }
        .header-bar span {
            font-size: 16px;
            font-weight: bold;
            color: #ffcc00;
        }

        /* Video Container */
        .player-container {
            position: relative;
            width: 100vw;
            height: calc(100vh - 53px);
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        /* Anti-Piracy Floating Watermark (User ID) */
        #watermark {
            position: absolute;
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            font-weight: bold;
            pointer-events: none;
            z-index: 999;
            transition: all 2s ease-in-out;
            text-shadow: 1px 1px 2px black;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <!-- Top Header with Logo and Studio Name -->
    <div class="header-bar">
        <img src="https://i.ibb.co/2Yp3CDq9/file-000000006f2c8211b20c6bedc9f9ac12.png" alt="ZK Logo">
        <span>ZK Dubbing Studio</span>
    </div>

    <!-- Video Player Container -->
    <div class="player-container" id="playerContainer">
        <div id="watermark">User ID: Loading...</div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const container = document.getElementById('playerContainer');

        if (!token) {
            container.innerHTML = "<h2 style='text-align:center; margin-top:50px; color:red;'>⚠️ Invalid or Expired Link!</h2>";
        } else {
            fetch(`https://zyphorkagex.onrender.com/api/verify-token?token=${token}`)
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        const videoUrl = data.videoUrl;
                        const userId = data.userId || "Protected";
                        
                        // Set Watermark Text
                        const watermark = document.getElementById('watermark');
                        watermark.innerText = `ID: ${userId} | ZK Dubbing`;

                        // Check if link is an embed/iframe player (like AbyssPlayer) or direct video file
                        if (videoUrl.includes('abyssplayer.com') || videoUrl.includes('embed') || videoUrl.includes('iframe')) {
                            container.innerHTML += `<iframe src="${videoUrl}" style="width:100%; height:100%; border:none;" allowfullscreen></iframe>`;
                        } else {
                            container.innerHTML += `<video id="videoPlayer" src="${videoUrl}" controls controlsList="nodownload" disablePictureInPicture style="width:100%; height:100%; object-fit:contain;"></video>`;
                        }

                        // Move watermark randomly to secure against screen recording
                        setInterval(() => {
                            const maxX = window.innerWidth - 150;
                            const maxY = window.innerHeight - 50;
                            const randomX = Math.floor(Math.random() * maxX);
                            const randomY = Math.floor(Math.random() * maxY);
                            watermark.style.left = `${randomX}px`;
                            watermark.style.top = `${randomY}px`;
                        }, 4000);

                    } else {
                        container.innerHTML = `<h2 style='text-align:center; margin-top:50px; color:red;'>❌ ${data.message || 'Link expired!'}</h2>`;
                    }
                })
                .catch(err => {
                    container.innerHTML = "<h2 style='text-align:center; margin-top:50px; color:red;'>❌ Server Error!</h2>";
                });
        }
    </script>
</body>
</html>
