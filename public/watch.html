<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kitsu Player - ZK Dubbing Studio</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100dvh;
            background-color: #000000;
            color: #ffffff;
            font-family: Arial, sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            display: flex;
            flex-direction: column;
        }
        .header-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: #1a1a1a;
            border-bottom: 1px solid #333;
            flex-shrink: 0;
            z-index: 20;
        }
        .header-left {
            display: flex;
            align-items: center;
        }
        .header-bar img {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 8px;
        }
        .header-bar span {
            font-size: 15px;
            font-weight: bold;
            color: #ffcc00;
        }
        .theater-btn {
            background: #2b2b2b;
            color: #ffcc00;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 5px 10px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }
        .exit-theater-btn {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: rgba(20, 20, 20, 0.85);
            color: #ffcc00;
            border: 1px solid rgba(255, 204, 0, 0.5);
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 12px;
            font-weight: bold;
            display: none;
            cursor: pointer;
        }
        body.theater-mode .header-bar {
            display: none;
        }
        body.theater-mode .exit-theater-btn {
            display: block;
        }
        .player-container {
            position: relative;
            width: 100%;
            flex: 1;
            min-height: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: filter 0.3s ease;
        }
        iframe, video {
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
            border: none;
            object-fit: contain;
        }
        #watermark {
            position: absolute;
            top: 15px;
            left: 15px;
            color: rgba(255, 255, 255, 0.18);
            font-size: 12px;
            font-weight: bold;
            pointer-events: none;
            z-index: 999;
            transition: all 6s linear;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.7);
            white-space: nowrap;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="header-bar" id="headerBar">
        <div class="header-left">
            <img src="https://i.ibb.co/2Yp3CDq9/file-000000006f2c8211b20c6bedc9f9ac12.png" alt="ZK Logo">
            <span>ZK Dubbing Studio</span>
        </div>
        <button type="button" class="theater-btn" id="enterTheaterBtn">⛶ Fullscreen</button>
    </div>

    <button type="button" class="exit-theater-btn" id="exitTheaterBtn">✕ Exit</button>

    <div class="player-container" id="playerContainer">
        <div id="watermark">ID: Loading...</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        const telegramUserId = tg.initDataUnsafe?.user?.id || '';

        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const container = document.getElementById('playerContainer');
        const enterTheaterBtn = document.getElementById('enterTheaterBtn');
        const exitTheaterBtn = document.getElementById('exitTheaterBtn');

        function toggleMiniAppFullscreen(enable) {
            if (enable) {
                document.body.classList.add('theater-mode');
                tg.expand();
                try {
                    if (typeof tg.requestFullscreen === 'function') {
                        tg.requestFullscreen();
                    }
                } catch (e) {}
            } else {
                document.body.classList.remove('theater-mode');
                try {
                    if (typeof tg.exitFullscreen === 'function') {
                        tg.exitFullscreen();
                    }
                } catch (e) {}
            }
        }

        enterTheaterBtn.addEventListener('click', () => toggleMiniAppFullscreen(true));
        exitTheaterBtn.addEventListener('click', () => toggleMiniAppFullscreen(false));

        document.addEventListener("visibilitychange", function() {
            if (document.hidden) {
                container.style.filter = "blur(30px)";
            } else {
                container.style.filter = "none";
            }
        });

        function showStatusMessage(htmlContent) {
            const msgBox = document.createElement('div');
            msgBox.style.textAlign = 'center';
            msgBox.style.marginTop = '50px';
            msgBox.style.padding = '20px';
            msgBox.style.color = 'red';
            msgBox.innerHTML = htmlContent;
            container.appendChild(msgBox);
        }

        if (!token) {
            showStatusMessage("<h2>⚠️ Invalid or Expired Link!</h2>");
        } else {
            fetch(`/api/verify-token?token=${encodeURIComponent(token)}&userId=${encodeURIComponent(telegramUserId)}`)
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        const videoUrl = data.videoUrl;
                        const userId = data.userId || telegramUserId || "Protected";

                        const watermark = document.getElementById('watermark');
                        watermark.innerText = `ID: ${userId} | ZK Dubbing`;

                        if (videoUrl && (videoUrl.includes('abyssplayer.com') || videoUrl.includes('embed') || videoUrl.includes('iframe'))) {
                            const iframe = document.createElement('iframe');
                            iframe.src = videoUrl;
                            iframe.allow = "fullscreen; autoplay; encrypted-media; picture-in-picture";
                            iframe.allowFullscreen = true;
                            iframe.setAttribute("webkitallowfullscreen", "true");
                            iframe.setAttribute("mozallowfullscreen", "true");
                            container.appendChild(iframe);
                        } else if (videoUrl) {
                            const vid = document.createElement('video');
                            vid.id = 'videoPlayer';
                            vid.src = videoUrl;
                            vid.controls = true;
                            vid.setAttribute("controlsList", "nodownload");
                            vid.setAttribute("disablePictureInPicture", "");
                            vid.setAttribute("playsinline", "");
                            vid.setAttribute("webkit-playsinline", "");
                            container.appendChild(vid);
                        } else {
                            showStatusMessage("<h2>❌ Video link not found in database!</h2>");
                        }

                        function moveWatermark() {
                            const containerWidth = container.clientWidth - 160;
                            const containerHeight = container.clientHeight - 30;
                            const randomX = Math.floor(Math.random() * Math.max(10, containerWidth));
                            const randomY = Math.floor(Math.random() * Math.max(10, containerHeight));
                            watermark.style.left = `${Math.max(10, randomX)}px`;
                            watermark.style.top = `${Math.max(10, randomY)}px`;
                        }

                        moveWatermark();
                        setInterval(moveWatermark, 6000);

                    } else {
                        showStatusMessage(`<h2>❌ ${data.message || 'Link expired!'}</h2>`);
                    }
                })
                .catch(err => {
                    showStatusMessage("<h2>❌ Server Error!</h2>");
                });
        }
    </script>
</body>
</html>
