<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kitsu Player - ZK Dubbing Studio</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100dvh;
            background-color: #000000;
            color: #ffffff;
            font-family: Arial, sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            display: flex;
            flex-direction: column;
        }
        .header-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: #1a1a1a;
            border-bottom: 1px solid #333;
            flex-shrink: 0;
            z-index: 20;
        }
        .header-left {
            display: flex;
            align-items: center;
        }
        .header-bar img {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 8px;
        }
        .header-bar span {
            font-size: 15px;
            font-weight: bold;
            color: #ffcc00;
        }
        .theater-btn {
            background: #2b2b2b;
            color: #ffcc00;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 5px 10px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }
        .exit-theater-btn {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: rgba(20, 20, 20, 0.85);
            color: #ffcc00;
            border: 1px solid rgba(255, 204, 0, 0.5);
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 12px;
            font-weight: bold;
            display: none;
            cursor: pointer;
        }
        body.theater-mode .header-bar,
        body.theater-mode .server-bar {
            display: none;
        }
        body.theater-mode .exit-theater-btn {
            display: block;
        }
        .player-container {
            position: relative;
            width: 100%;
            flex: 1;
            min-height: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: filter 0.3s ease;
        }
        iframe, video {
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
            border: none;
            object-fit: contain;
        }
        #watermark {
            position: absolute;
            top: 15px;
            left: 15px;
            color: rgba(255, 255, 255, 0.18);
            font-size: 12px;
            font-weight: bold;
            pointer-events: none;
            z-index: 999;
            transition: all 6s linear;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.7);
            white-space: nowrap;
        }
        .server-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: #141414;
            border-top: 1px solid #2a2a2a;
            overflow-x: auto;
            flex-shrink: 0;
            z-index: 20;
        }
        .server-bar-label {
            font-size: 12px;
            color: #aaaaaa;
            white-space: nowrap;
            font-weight: bold;
        }
        .server-btn {
            background: #242424;
            color: #ffffff;
            border: 1px solid #3c3c3c;
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
            cursor: pointer;
        }
        .server-btn.active {
            background: #ffcc00;
            color: #000000;
            border-color: #ffcc00;
        }
        .blocked-box {
            text-align: center;
            padding: 24px;
            max-width: 420px;
        }
        .blocked-box h2 {
            color: #ff4d4d;
            margin-bottom: 10px;
        }
        .blocked-box p {
            color: #cccccc;
            font-size: 14px;
            line-height: 1.5;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="header-bar" id="headerBar">
        <div class="header-left">
            <img src="https://i.ibb.co/2Yp3CDq9/file-000000006f2c8211b20c6bedc9f9ac12.png" alt="ZK Logo">
            <span>ZK Dubbing Studio</span>
        </div>
        <button type="button" class="theater-btn" id="enterTheaterBtn">⛶ Fullscreen</button>
    </div>

    <button type="button" class="exit-theater-btn" id="exitTheaterBtn">✕ Exit</button>

    <div class="player-container" id="playerContainer">
        <div id="watermark">ID: Loading...</div>
    </div>

    <div class="server-bar" id="serverBar" style="display: none;">
        <span class="server-bar-label">Servers:</span>
        <div id="serverButtons" style="display: flex; gap: 8px;"></div>
    </div>

    <script>
        const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
        if (tg) {
            try { tg.ready(); } catch (_) {}
            try { tg.expand(); } catch (_) {}
        }

        const initData = tg && typeof tg.initData === 'string' ? tg.initData.trim() : '';
        const telegramUserId = tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id
            ? String(tg.initDataUnsafe.user.id)
            : '';

        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const container = document.getElementById('playerContainer');
        const watermark = document.getElementById('watermark');
        const enterTheaterBtn = document.getElementById('enterTheaterBtn');
        const exitTheaterBtn = document.getElementById('exitTheaterBtn');
        const serverBar = document.getElementById('serverBar');
        const serverButtons = document.getElementById('serverButtons');

        function checkTelegramMiniAppContext() {
            if (!tg) return false;
            const hasInitData = initData.length > 0;
            const hasUser = Boolean(tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id);
            const hasChat = Boolean(tg.initDataUnsafe && tg.initDataUnsafe.chat && tg.initDataUnsafe.chat.id);
            const hasHashParams = window.location.hash.includes('tgWebAppData=') || window.location.hash.includes('tgWebAppVersion=');
            const hasPlatform = Boolean(tg.platform && tg.platform !== 'unknown');
            const isTgUserAgent = /Telegram/i.test(navigator.userAgent || '');

            return hasInitData || hasUser || hasChat || hasHashParams || (hasPlatform && isTgUserAgent);
        }

        const isInsideTelegramMiniApp = checkTelegramMiniAppContext();

        function toggleMiniAppFullscreen(enable) {
            if (!tg) return;
            if (enable) {
                document.body.classList.add('theater-mode');
                try { tg.expand(); } catch (_) {}
                try {
                    if (typeof tg.requestFullscreen === 'function') {
                        tg.requestFullscreen();
                    }
                } catch (_) {}
            } else {
                document.body.classList.remove('theater-mode');
                try {
                    if (typeof tg.exitFullscreen === 'function') {
                        tg.exitFullscreen();
                    }
                } catch (_) {}
            }
        }

        enterTheaterBtn.addEventListener('click', () => toggleMiniAppFullscreen(true));
        exitTheaterBtn.addEventListener('click', () => toggleMiniAppFullscreen(false));

        document.addEventListener("visibilitychange", function() {
            if (document.hidden) {
                container.style.filter = "blur(30px)";
            } else {
                container.style.filter = "none";
            }
        });

        function clearMediaElements() {
            const existingMedia = container.querySelectorAll('iframe, video, .blocked-box');
            existingMedia.forEach(el => el.remove());
        }

        function isEmbedUrl(url) {
            const lower = url.toLowerCase();
            return (
                lower.includes('abyssplayer.com') ||
                lower.includes('embed') ||
                lower.includes('iframe') ||
                lower.includes('filemoon') ||
                lower.includes('vdohide') ||
                lower.includes('ramnal') ||
                lower.includes('/e/') ||
                lower.includes('/v/')
            );
        }

        function renderServerStream(videoUrl) {
            clearMediaElements();
            if (!videoUrl) {
                showBlockedMessage(
                    "❌ Video Not Found",
                    "Database mein is episode ka video link nahi mila."
                );
                return;
            }

            if (isEmbedUrl(videoUrl)) {
                const iframe = document.createElement('iframe');
                iframe.src = videoUrl;
                iframe.allow = "fullscreen; autoplay; encrypted-media; picture-in-picture";
                iframe.allowFullscreen = true;
                iframe.setAttribute("webkitallowfullscreen", "true");
                iframe.setAttribute("mozallowfullscreen", "true");
                container.appendChild(iframe);
            } else {
                const vid = document.createElement('video');
                vid.id = 'videoPlayer';
                vid.src = videoUrl;
                vid.controls = true;
                vid.autoplay = true;
                vid.setAttribute("controlsList", "nodownload");
                vid.setAttribute("disablePictureInPicture", "");
                vid.setAttribute("playsinline", "");
                vid.setAttribute("webkit-playsinline", "");
                container.appendChild(vid);
            }
        }

        function parseFallbackServers(rawValue) {
            if (!rawValue) return [];
            if (Array.isArray(rawValue)) {
                return rawValue
                    .map((item, idx) => {
                        if (typeof item === 'string' && item.trim()) {
                            return { name: `Server ${idx + 1}`, url: item.trim() };
                        }
                        if (item && typeof item === 'object' && item.url) {
                            return { name: item.name || `Server ${idx + 1}`, url: String(item.url).trim() };
                        }
                        return null;
                    })
                    .filter(Boolean);
            }
            if (typeof rawValue === 'string') {
                const trimmed = rawValue.trim();
                if (trimmed.startsWith('[')) {
                    try {
                        const parsed = JSON.parse(trimmed);
                        if (Array.isArray(parsed)) return parseFallbackServers(parsed);
                    } catch (_) {}
                }
                if (trimmed) return [{ name: "Server 1", url: trimmed }];
            }
            return [];
        }

        function renderServerSelector(servers, activeIndex = 0) {
            serverButtons.innerHTML = '';
            if (!Array.isArray(servers) || servers.length === 0) {
                serverBar.style.display = 'none';
                return;
            }

            serverBar.style.display = 'flex';
            servers.forEach((srv, idx) => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'server-btn' + (idx === activeIndex ? ' active' : '');
                btn.textContent = srv.name || `Server ${idx + 1}`;
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    renderServerStream(srv.url);
                });
                serverButtons.appendChild(btn);
            });
        }

        function showBlockedMessage(titleText, descText) {
            watermark.style.display = 'none';
            enterTheaterBtn.style.display = 'none';
            serverBar.style.display = 'none';
            clearMediaElements();

            const box = document.createElement('div');
            box.className = 'blocked-box';

            const h2 = document.createElement('h2');
            h2.textContent = titleText;

            const p = document.createElement('p');
            p.textContent = descText;

            box.appendChild(h2);
            box.appendChild(p);
            container.appendChild(box);
        }

        if (!isInsideTelegramMiniApp) {
            showBlockedMessage(
                "🚫 Access Denied (Telegram Mini App Only)",
                "Yeh episode external browser (Chrome) ya kisi aur jagah nahi chal sakta. Kripya Telegram bot ke andar Mini App se hi open karein."
            );
        } else if (!token) {
            showBlockedMessage(
                "⚠️ Invalid or Expired Link",
                "Link valid nahi hai ya expire ho chuka hai."
            );
        } else {
            const verifyUrl = `/api/verify-token?token=${encodeURIComponent(token)}&userId=${encodeURIComponent(telegramUserId)}`;

            fetch(verifyUrl, {
                headers: {
                    "X-Telegram-Init-Data": initData
                }
            })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        const userId = data.userId || telegramUserId || "Protected";
                        watermark.textContent = `ID: ${userId} | ZK Dubbing`;

                        let serverList = Array.isArray(data.servers) && data.servers.length > 0
                            ? data.servers
                            : parseFallbackServers(data.videoUrl);

                        renderServerSelector(serverList, 0);
                        renderServerStream(serverList.length > 0 ? serverList[0].url : "");

                        function moveWatermark() {
                            const containerWidth = container.clientWidth - 160;
                            const containerHeight = container.clientHeight - 30;
                            const randomX = Math.floor(Math.random() * Math.max(10, containerWidth));
                            const randomY = Math.floor(Math.random() * Math.max(10, containerHeight));
                            watermark.style.left = `${Math.max(10, randomX)}px`;
                            watermark.style.top = `${Math.max(10, randomY)}px`;
                        }

                        moveWatermark();
                        setInterval(moveWatermark, 6000);
                    } else {
                        showBlockedMessage(
                            "❌ Access Blocked",
                            data.message || "Link expire ho chuka hai ya Telegram Mini App verification fail hua."
                        );
                    }
                })
                .catch(() => {
                    showBlockedMessage(
                        "❌ Server Error",
                        "Video verify karne mein server error aaya hai."
                    );
                });
        }
    </script>
</body>
</html>
