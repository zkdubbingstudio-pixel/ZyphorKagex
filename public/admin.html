<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitsu Admin Panel - ZK Dubbing Studio</title>
    <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
    <style>
        body {
            background-color: #0f0f0f;
            color: #ffffff;
            font-family: Arial, sans-serif;
            padding: 15px;
            margin: 0;
        }
        .login-box {
            max-width: 400px;
            margin: 60px auto;
            background: #1a1a1a;
            padding: 24px;
            border-radius: 8px;
            border: 1px solid #333;
            box-shadow: 0 4px 14px rgba(0,0,0,0.6);
        }
        .login-box h2 {
            margin-top: 0;
            text-align: center;
            color: #ffcc00;
        }
        .login-error {
            color: #ff4d4d;
            font-size: 13px;
            margin: -6px 0 12px 0;
            min-height: 18px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: #1a1a1a;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h2 {
            text-align: center;
            color: #ffcc00;
        }
        label {
            font-size: 14px;
            color: #ccc;
            display: block;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px 0;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .login-btn {
            background: #ffcc00;
            color: #000000;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }
        .login-btn:hover {
            background: #e6b800;
        }
        .url-label-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 8px;
        }
        .url-label-row label {
            margin: 0;
        }
        .add-server-btn {
            width: auto;
            margin: 0;
            padding: 4px 12px;
            background: #28a745;
            border: none;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            line-height: 1.2;
        }
        .add-server-btn:hover {
            background: #218838;
        }
        #serversContainer {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 8px 0 15px 0;
        }
        .server-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .server-row input {
            flex: 1;
            margin: 0;
        }
        .remove-server-btn {
            width: auto;
            margin: 0;
            padding: 10px 12px;
            background: #dc3545;
            border: none;
            color: #fff;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        .remove-server-btn:hover {
            background: #b02a37;
        }
        button.submit-btn {
            background: #0088cc;
            font-weight: bold;
            cursor: pointer;
        }
        button.submit-btn:hover {
            background: #006699;
        }
        .episode-item {
            background: #222;
            padding: 12px;
            margin-top: 10px;
            border-radius: 6px;
            border-left: 4px solid #ffcc00;
        }
        .btn-group {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        .btn-group button {
            flex: 1;
            padding: 7px;
            font-size: 12px;
            margin: 0;
            cursor: pointer;
            border-radius: 4px;
            border: none;
            font-weight: bold;
        }
        .btn-copy { background: #28a745; color: #fff; }
        .btn-edit { background: #ffc107; color: #000; }
        .btn-delete { background: #dc3545; color: #fff; }
    </style>
</head>
<body>
    <div class="login-box" id="loginBox">
        <h2>🔐 Admin Login</h2>
        <form id="adminLoginForm">
            <label for="loginTelegramId">Telegram ID:</label>
            <input type="text" id="loginTelegramId" inputmode="numeric" required placeholder="Enter Telegram ID">

            <label for="loginPassword">Password:</label>
            <input type="password" id="loginPassword" required placeholder="Enter Password">

            <div class="login-error" id="loginError"></div>
            <button type="submit" class="login-btn">Unlock Admin Panel</button>
        </form>
    </div>

    <div class="container" id="adminContainer" style="display: none;">
        <h2 id="formTitle">🎬 Publish Episode</h2>
        <form id="episodeForm">
            <input type="hidden" id="editEpisodeId">
            <label>Anime Name:</label>
            <input type="text" id="animeName" required placeholder="Anime Name">
            
            <label>Episode Number:</label>
            <input type="text" id="episodeNumber" required placeholder="01">
            
            <label>Title (Optional):</label>
            <input type="text" id="title" placeholder="Episode Title">
            
            <div class="url-label-row">
                <label>Video Stream URL / File Path (Servers):</label>
                <button type="button" class="add-server-btn" id="addServerBtn" title="Add Server">+</button>
            </div>
            <div id="serversContainer">
                <div class="server-row">
                    <input type="text" class="server-url-input" required placeholder="Server 1 URL (VDOHide / Filemoon / Embed)">
                </div>
            </div>
            
            <button type="submit" class="submit-btn" id="submitBtn">Publish Episode</button>
            <button type="button" id="cancelBtn" style="background:#555; display:none;" onclick="resetForm()">Cancel Edit</button>
        </form>

        <h3 style="margin-top: 30px; border-bottom: 1px solid #444; padding-bottom: 5px;">📁 Published Episodes List</h3>
        <div id="episodesList">Loading episodes...</div>
    </div>

    <script>
        (function () {
            const ALLOWED_TELEGRAM_IDS = ["6144546817", "8528056660"];
            const ADMIN_PASSWORD = atob("QXRyaW5hbmRhbjg3"); // Atrinandan87

            const loginBox = document.getElementById('loginBox');
            const adminContainer = document.getElementById('adminContainer');
            const adminLoginForm = document.getElementById('adminLoginForm');
            const loginTelegramIdInput = document.getElementById('loginTelegramId');
            const loginPasswordInput = document.getElementById('loginPassword');
            const loginError = document.getElementById('loginError');

            let initData = '';
            let tgUserId = '';

            try {
                const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
                if (tg) {
                    if (typeof tg.ready === 'function') tg.ready();
                    if (typeof tg.expand === 'function') tg.expand();
                    initData = typeof tg.initData === 'string' ? tg.initData.trim() : '';
                    tgUserId = tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id
                        ? String(tg.initDataUnsafe.user.id)
                        : '';
                }
            } catch (_) {}

            if (tgUserId && ALLOWED_TELEGRAM_IDS.includes(tgUserId)) {
                loginTelegramIdInput.value = tgUserId;
            }

            let activeAdminId = null;
            let panelInitialized = false;

            function adminHeaders(includeJson = false) {
                const headers = {
                    'X-Admin-Id': String(activeAdminId)
                };
                if (initData) {
                    headers['X-Telegram-Init-Data'] = initData;
                }
                if (includeJson) {
                    headers['Content-Type'] = 'application/json';
                }
                return headers;
            }

            adminLoginForm.addEventListener('submit', function (e) {
                e.preventDefault();
                const enteredId = loginTelegramIdInput.value.trim();
                const enteredPass = loginPasswordInput.value;

                if (!ALLOWED_TELEGRAM_IDS.includes(enteredId)) {
                    loginError.textContent = "Galat Telegram ID! Sirf authorized admin ID allowed hai.";
                    return;
                }

                if (enteredPass !== ADMIN_PASSWORD) {
                    loginError.textContent = "Galat Password! Dobara koshish karein.";
                    return;
                }

                loginError.textContent = "";
                activeAdminId = enteredId;
                loginBox.style.display = 'none';
                adminContainer.style.display = 'block';

                if (!panelInitialized) {
                    panelInitialized = true;
                    initAdminPanel();
                }
            });

            function initAdminPanel() {
                let allEpisodes = [];
                const serversContainer = document.getElementById('serversContainer');
                const addServerBtn = document.getElementById('addServerBtn');

                function updateServerPlaceholders() {
                    const rows = serversContainer.querySelectorAll('.server-row');
                    rows.forEach((row, idx) => {
                        const inp = row.querySelector('.server-url-input');
                        if (inp) {
                            inp.placeholder = `Server ${idx + 1} URL (VDOHide / Filemoon / Embed)`;
                            inp.required = idx === 0;
                        }
                    });
                }

                function createServerRow(value = '', isFirst = false) {
                    const row = document.createElement('div');
                    row.className = 'server-row';

                    const input = document.createElement('input');
                    input.type = 'text';
                    input.className = 'server-url-input';
                    input.value = value;
                    input.required = isFirst;
                    row.appendChild(input);

                    if (!isFirst) {
                        const removeBtn = document.createElement('button');
                        removeBtn.type = 'button';
                        removeBtn.className = 'remove-server-btn';
                        removeBtn.textContent = '✕';
                        removeBtn.title = 'Remove Server';
                        removeBtn.addEventListener('click', function () {
                            row.remove();
                            updateServerPlaceholders();
                        });
                        row.appendChild(removeBtn);
                    }

                    return row;
                }

                function setServerInputs(urls = []) {
                    serversContainer.innerHTML = '';
                    const list = Array.isArray(urls) && urls.length > 0 ? urls : [''];
                    list.forEach((url, idx) => {
                        serversContainer.appendChild(createServerRow(url, idx === 0));
                    });
                    updateServerPlaceholders();
                }

                function parseStoredVideoUrls(rawValue) {
                    if (!rawValue) return [''];
                    if (Array.isArray(rawValue)) {
                        return rawValue.map(v => typeof v === 'string' ? v : (v && v.url ? v.url : '')).filter(Boolean);
                    }
                    if (typeof rawValue === 'string') {
                        const trimmed = rawValue.trim();
                        if (trimmed.startsWith('[')) {
                            try {
                                const parsed = JSON.parse(trimmed);
                                if (Array.isArray(parsed)) {
                                    const items = parsed.map(v => typeof v === 'string' ? v : (v && v.url ? v.url : '')).filter(Boolean);
                                    return items.length > 0 ? items : [''];
                                }
                            } catch (_) {}
                        }
                        return [trimmed];
                    }
                    return [''];
                }

                function getCollectedServers() {
                    const inputs = Array.from(serversContainer.querySelectorAll('.server-url-input'));
                    return inputs
                        .map((inp, idx) => ({
                            name: `Server ${idx + 1}`,
                            url: inp.value.trim()
                        }))
                        .filter(s => s.url.length > 0);
                }

                addServerBtn.addEventListener('click', function () {
                    serversContainer.appendChild(createServerRow('', false));
                    updateServerPlaceholders();
                });

                async function fetchEpisodes() {
                    try {
                        const res = await fetch('/api/episodes', {
                            headers: adminHeaders(false)
                        });
                        if (!res.ok) {
                            throw new Error(`HTTP ${res.status}`);
                        }
                        allEpisodes = await res.json();
                        const listDiv = document.getElementById('episodesList');

                        if (!Array.isArray(allEpisodes) || allEpisodes.length === 0) {
                            listDiv.innerHTML = "<p>No episodes published yet.</p>";
                            return;
                        }

                        listDiv.innerHTML = allEpisodes.map(ep => {
                            const botLink = `https://t.me/Kitsu_zk_bot?start=${ep.id}`;
                            const serverCount = parseStoredVideoUrls(ep.video_url).filter(Boolean).length;
                            const serverBadge = serverCount > 1 ? ` • <span style="color:#ffcc00;">${serverCount} Servers</span>` : '';
                            return `
                                <div class="episode-item">
                                    <strong>${ep.anime_name} - Ep ${ep.episode_number}</strong>${serverBadge}<br>
                                    <small style="color: #aaa;">${ep.title || 'No title'}</small><br>
                                    <span style="color: #00aaee; font-size: 11px; word-break: break-all;">Bot Link: ${botLink}</span>
                                    <div class="btn-group">
                                        <button class="btn-copy" onclick="copyLink('${botLink}')">Copy Link</button>
                                        <button class="btn-edit" onclick="editEpisode('${ep.id}')">Edit</button>
                                        <button class="btn-delete" onclick="deleteEpisode('${ep.id}')">Delete</button>
                                    </div>
                                </div>
                            `;
                        }).join('');
                    } catch (err) {
                        document.getElementById('episodesList').innerHTML = "<p style='color:red;'>Failed to load episodes.</p>";
                    }
                }

                window.copyLink = function (url) {
                    navigator.clipboard.writeText(url).then(() => {
                        alert("Telegram Bot Link copied to clipboard!");
                    }).catch(() => {
                        alert("Failed to copy link.");
                    });
                };

                window.editEpisode = function (id) {
                    const ep = allEpisodes.find(e => e.id === id);
                    if (!ep) return;
                    document.getElementById('editEpisodeId').value = ep.id;
                    document.getElementById('animeName').value = ep.anime_name;
                    document.getElementById('episodeNumber').value = ep.episode_number;
                    document.getElementById('title').value = ep.title || '';
                    setServerInputs(parseStoredVideoUrls(ep.video_url));

                    document.getElementById('formTitle').innerText = "✏️ Edit Episode";
                    document.getElementById('submitBtn').innerText = "Update Episode";
                    document.getElementById('cancelBtn').style.display = "block";
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                };

                window.resetForm = function () {
                    document.getElementById('episodeForm').reset();
                    document.getElementById('editEpisodeId').value = '';
                    setServerInputs(['']);
                    document.getElementById('formTitle').innerText = "🎬 Publish Episode";
                    document.getElementById('submitBtn').innerText = "Publish Episode";
                    document.getElementById('cancelBtn').style.display = "none";
                };

                window.deleteEpisode = async function (id) {
                    if (!confirm("Are you sure you want to delete this episode?")) return;
                    try {
                        const res = await fetch(`/api/episodes/${id}`, {
                            method: 'DELETE',
                            headers: adminHeaders(false)
                        });
                        const data = await res.json();
                        if (data.success) {
                            alert("Episode deleted successfully!");
                            fetchEpisodes();
                        } else {
                            alert("Error: " + (data.error || "Delete failed"));
                        }
                    } catch (err) {
                        alert("Server error during delete!");
                    }
                };

                document.getElementById('episodeForm').addEventListener('submit', async function (e) {
                    e.preventDefault();
                    const editId = document.getElementById('editEpisodeId').value;
                    const animeName = document.getElementById('animeName').value;
                    const episodeNumber = document.getElementById('episodeNumber').value;
                    const title = document.getElementById('title').value;
                    const servers = getCollectedServers();
                    const videoUrl = servers.length > 0 ? servers[0].url : '';

                    if (!videoUrl) {
                        alert("Please enter at least one valid video URL.");
                        return;
                    }

                    const url = editId ? `/api/episodes/${editId}` : '/api/episodes';
                    const method = editId ? 'PUT' : 'POST';

                    try {
                        const res = await fetch(url, {
                            method: method,
                            headers: adminHeaders(true),
                            body: JSON.stringify({ animeName, episodeNumber, title, videoUrl, servers })
                        });
                        const data = await res.json();
                        if (data.success) {
                            alert(editId ? "Episode updated successfully!" : "Episode published successfully!");
                            resetForm();
                            fetchEpisodes();
                        } else {
                            alert("Error: " + (data.error || "Operation failed"));
                        }
                    } catch (err) {
                        alert("Server error!");
                    }
                });

                fetchEpisodes();
            }
        })();
    </script>
</body>
</html>
