<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitsu Admin Panel - ZK Dubbing Studio</title>
    <style>
        body {
            background-color: #0f0f0f;
            color: #ffffff;
            font-family: Arial, sans-serif;
            padding: 15px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: #1a1a1a;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h2 {
            text-align: center;
            color: #ffcc00;
        }
        label {
            font-size: 14px;
            color: #ccc;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px 0;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button.submit-btn {
            background: #0088cc;
            font-weight: bold;
            cursor: pointer;
        }
        button.submit-btn:hover {
            background: #006699;
        }
        .episode-item {
            background: #222;
            padding: 12px;
            margin-top: 10px;
            border-radius: 6px;
            border-left: 4px solid #ffcc00;
        }
        .btn-group {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        .btn-group button {
            flex: 1;
            padding: 7px;
            font-size: 12px;
            margin: 0;
            cursor: pointer;
            border-radius: 4px;
            border: none;
            font-weight: bold;
        }
        .btn-copy { background: #28a745; color: #fff; }
        .btn-edit { background: #ffc107; color: #000; }
        .btn-delete { background: #dc3545; color: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <h2 id="formTitle">🎬 Publish Episode</h2>
        <form id="episodeForm">
            <input type="hidden" id="editEpisodeId">
            <label>Anime Name:</label>
            <input type="text" id="animeName" required placeholder="Anime Name">
            
            <label>Episode Number:</label>
            <input type="text" id="episodeNumber" required placeholder="01">
            
            <label>Title (Optional):</label>
            <input type="text" id="title" placeholder="Episode Title">
            
            <label>Video Stream URL / File Path:</label>
            <input type="text" id="videoUrl" required placeholder="https://fembed.co/embed/...">
            
            <button type="submit" class="submit-btn" id="submitBtn">Publish Episode</button>
            <button type="button" id="cancelBtn" style="background:#555; display:none;" onclick="resetForm()">Cancel Edit</button>
        </form>

        <h3 style="margin-top: 30px; border-bottom: 1px solid #444; padding-bottom: 5px;">📁 Published Episodes List</h3>
        <div id="episodesList">Loading episodes...</div>
    </div>

    <script>
        let allEpisodes = [];

        async function fetchEpisodes() {
            try {
                const res = await fetch('/api/episodes');
                allEpisodes = await res.json();
                const listDiv = document.getElementById('episodesList');
                
                if (!allEpisodes || allEpisodes.length === 0) {
                    listDiv.innerHTML = "<p>No episodes published yet.</p>";
                    return;
                }

                listDiv.innerHTML = allEpisodes.map(ep => {
                    const botLink = `https://t.me/Kitsu_zk_bot?start=${ep.id}`;
                    return `
                        <div class="episode-item">
                            <strong>${ep.anime_name} - Ep ${ep.episode_number}</strong><br>
                            <small style="color: #aaa;">${ep.title || 'No title'}</small><br>
                            <span style="color: #00aaee; font-size: 11px; word-break: break-all;">Bot Link: ${botLink}</span>
                            <div class="btn-group">
                                <button class="btn-copy" onclick="copyLink('${botLink}')">Copy Link</button>
                                <button class="btn-edit" onclick="editEpisode('${ep.id}')">Edit</button>
                                <button class="btn-delete" onclick="deleteEpisode('${ep.id}')">Delete</button>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (err) {
                document.getElementById('episodesList').innerHTML = "<p style='color:red;'>Failed to load episodes.</p>";
            }
        }

        function copyLink(url) {
            navigator.clipboard.writeText(url).then(() => {
                alert("Telegram Bot Link copied to clipboard!");
            }).catch(err => {
                alert("Failed to copy link.");
            });
        }

        function editEpisode(id) {
            const ep = allEpisodes.find(e => e.id === id);
            if (!ep) return;
            document.getElementById('editEpisodeId').value = ep.id;
            document.getElementById('animeName').value = ep.anime_name;
            document.getElementById('episodeNumber').value = ep.episode_number;
            document.getElementById('title').value = ep.title || '';
            document.getElementById('videoUrl').value = ep.video_url;
            
            document.getElementById('formTitle').innerText = "✏️ Edit Episode";
            document.getElementById('submitBtn').innerText = "Update Episode";
            document.getElementById('cancelBtn').style.display = "block";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            document.getElementById('episodeForm').reset();
            document.getElementById('editEpisodeId').value = '';
            document.getElementById('formTitle').innerText = "🎬 Publish Episode";
            document.getElementById('submitBtn').innerText = "Publish Episode";
            document.getElementById('cancelBtn').style.display = "none";
        }

        async function deleteEpisode(id) {
            if (!confirm("Are you sure you want to delete this episode?")) return;
            try {
                const res = await fetch(`/api/episodes/${id}`, { method: 'DELETE' });
                const data = await res.json();
                if (data.success) {
                    alert("Episode deleted successfully!");
                    fetchEpisodes();
                } else {
                    alert("Error: " + (data.error || "Delete failed"));
                }
            } catch (err) {
                alert("Server error during delete!");
            }
        }

        document.getElementById('episodeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const editId = document.getElementById('editEpisodeId').value;
            const animeName = document.getElementById('animeName').value;
            const episodeNumber = document.getElementById('episodeNumber').value;
            const title = document.getElementById('title').value;
            const videoUrl = document.getElementById('videoUrl').value;

            const url = editId ? `/api/episodes/${editId}` : '/api/episodes';
            const method = editId ? 'PUT' : 'POST';

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ animeName, episodeNumber, title, videoUrl })
                });
                const data = await res.json();
                if (data.success) {
                    alert(editId ? "Episode updated successfully!" : "Episode published successfully!");
                    resetForm();
                    fetchEpisodes();
                } else {
                    alert("Error: " + (data.error || "Operation failed"));
                }
            } catch (err) {
                alert("Server error!");
            }
        });

        fetchEpisodes();
    </script>
</body>
</html>
