<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitsu Admin Panel - ZK Dubbing Studio</title>
    <style>
        body {
            background-color: #0f0f0f;
            color: #ffffff;
            font-family: Arial, sans-serif;
            padding: 15px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: #1a1a1a;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h2 {
            text-align: center;
            color: #ffcc00;
        }
        label {
            font-size: 14px;
            color: #ccc;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px 0;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .url-label-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 8px;
        }
        .url-label-row label {
            margin: 0;
        }
        .add-server-btn {
            width: auto;
            margin: 0;
            padding: 4px 12px;
            background: #28a745;
            border: none;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            line-height: 1.2;
        }
        .add-server-btn:hover {
            background: #218838;
        }
        #serversContainer {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 8px 0 15px 0;
        }
        .server-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .server-row input {
            flex: 1;
            margin: 0;
        }
        .remove-server-btn {
            width: auto;
            margin: 0;
            padding: 10px 12px;
            background: #dc3545;
            border: none;
            color: #fff;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        .remove-server-btn:hover {
            background: #b02a37;
        }
        button.submit-btn {
            background: #0088cc;
            font-weight: bold;
            cursor: pointer;
        }
        button.submit-btn:hover {
            background: #006699;
        }
        .episode-item {
            background: #222;
            padding: 12px;
            margin-top: 10px;
            border-radius: 6px;
            border-left: 4px solid #ffcc00;
        }
        .btn-group {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        .btn-group button {
            flex: 1;
            padding: 7px;
            font-size: 12px;
            margin: 0;
            cursor: pointer;
            border-radius: 4px;
            border: none;
            font-weight: bold;
        }
        .btn-copy { background: #28a745; color: #fff; }
        .btn-edit { background: #ffc107; color: #000; }
        .btn-delete { background: #dc3545; color: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <h2 id="formTitle">🎬 Publish Episode</h2>
        <form id="episodeForm">
            <input type="hidden" id="editEpisodeId">
            <label>Anime Name:</label>
            <input type="text" id="animeName" required placeholder="Anime Name">
            
            <label>Episode Number:</label>
            <input type="text" id="episodeNumber" required placeholder="01">
            
            <label>Title (Optional):</label>
            <input type="text" id="title" placeholder="Episode Title">
            
            <div class="url-label-row">
                <label>Video Stream URL / File Path (Servers):</label>
                <button type="button" class="add-server-btn" id="addServerBtn" title="Add Server">+</button>
            </div>
            <div id="serversContainer">
                <div class="server-row">
                    <input type="text" class="server-url-input" required placeholder="Server 1 URL (VDOHide / Filemoon / Embed)">
                </div>
            </div>
            
            <button type="submit" class="submit-btn" id="submitBtn">Publish Episode</button>
            <button type="button" id="cancelBtn" style="background:#555; display:none;" onclick="resetForm()">Cancel Edit</button>
        </form>

        <h3 style="margin-top: 30px; border-bottom: 1px solid #444; padding-bottom: 5px;">📁 Published Episodes List</h3>
        <div id="episodesList">Loading episodes...</div>
    </div>

    <script>
        let allEpisodes = [];
        const serversContainer = document.getElementById('serversContainer');
        const addServerBtn = document.getElementById('addServerBtn');

        function updateServerPlaceholders() {
            const rows = serversContainer.querySelectorAll('.server-row');
            rows.forEach((row, idx) => {
                const inp = row.querySelector('.server-url-input');
                if (inp) {
                    inp.placeholder = `Server ${idx + 1} URL (VDOHide / Filemoon / Embed)`;
                    inp.required = idx === 0;
                }
            });
        }

        function createServerRow(value = '', isFirst = false) {
            const row = document.createElement('div');
            row.className = 'server-row';

            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'server-url-input';
            input.value = value;
            input.required = isFirst;
            row.appendChild(input);

            if (!isFirst) {
                const removeBtn = document.createElement('button');
                removeBtn.type = 'button';
                removeBtn.className = 'remove-server-btn';
                removeBtn.textContent = '✕';
                removeBtn.title = 'Remove Server';
                removeBtn.addEventListener('click', () => {
                    row.remove();
                    updateServerPlaceholders();
                });
                row.appendChild(removeBtn);
            }

            return row;
        }

        function setServerInputs(urls = []) {
            serversContainer.innerHTML = '';
            const list = Array.isArray(urls) && urls.length > 0 ? urls : [''];
            list.forEach((url, idx) => {
                serversContainer.appendChild(createServerRow(url, idx === 0));
            });
            updateServerPlaceholders();
        }

        function parseStoredVideoUrls(rawValue) {
            if (!rawValue) return [''];
            if (Array.isArray(rawValue)) {
                return rawValue.map(v => typeof v === 'string' ? v : (v && v.url ? v.url : '')).filter(Boolean);
            }
            if (typeof rawValue === 'string') {
                const trimmed = rawValue.trim();
                if (trimmed.startsWith('[')) {
                    try {
                        const parsed = JSON.parse(trimmed);
                        if (Array.isArray(parsed)) {
                            const items = parsed.map(v => typeof v === 'string' ? v : (v && v.url ? v.url : '')).filter(Boolean);
                            return items.length > 0 ? items : [''];
                        }
                    } catch (_) {}
                }
                return [trimmed];
            }
            return [''];
        }

        function getCollectedServers() {
            const inputs = Array.from(serversContainer.querySelectorAll('.server-url-input'));
            return inputs
                .map((inp, idx) => ({
                    name: `Server ${idx + 1}`,
                    url: inp.value.trim()
                }))
                .filter(s => s.url.length > 0);
        }

        addServerBtn.addEventListener('click', () => {
            serversContainer.appendChild(createServerRow('', false));
            updateServerPlaceholders();
        });

        async function fetchEpisodes() {
            try {
                const res = await fetch('/api/episodes');
                allEpisodes = await res.json();
                const listDiv = document.getElementById('episodesList');
                
                if (!Array.isArray(allEpisodes) || allEpisodes.length === 0) {
                    listDiv.innerHTML = "<p>No episodes published yet.</p>";
                    return;
                }

                listDiv.innerHTML = allEpisodes.map(ep => {
                    const botLink = `https://t.me/Kitsu_zk_bot?start=${ep.id}`;
                    const serverCount = parseStoredVideoUrls(ep.video_url).filter(Boolean).length;
                    const serverBadge = serverCount > 1 ? ` • <span style="color:#ffcc00;">${serverCount} Servers</span>` : '';
                    return `
                        <div class="episode-item">
                            <strong>${ep.anime_name} - Ep ${ep.episode_number}</strong>${serverBadge}<br>
                            <small style="color: #aaa;">${ep.title || 'No title'}</small><br>
                            <span style="color: #00aaee; font-size: 11px; word-break: break-all;">Bot Link: ${botLink}</span>
                            <div class="btn-group">
                                <button class="btn-copy" onclick="copyLink('${botLink}')">Copy Link</button>
                                <button class="btn-edit" onclick="editEpisode('${ep.id}')">Edit</button>
                                <button class="btn-delete" onclick="deleteEpisode('${ep.id}')">Delete</button>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (err) {
                document.getElementById('episodesList').innerHTML = "<p style='color:red;'>Failed to load episodes.</p>";
            }
        }

        function copyLink(url) {
            navigator.clipboard.writeText(url).then(() => {
                alert("Telegram Bot Link copied to clipboard!");
            }).catch(err => {
                alert("Failed to copy link.");
            });
        }

        function editEpisode(id) {
            const ep = allEpisodes.find(e => e.id === id);
            if (!ep) return;
            document.getElementById('editEpisodeId').value = ep.id;
            document.getElementById('animeName').value = ep.anime_name;
            document.getElementById('episodeNumber').value = ep.episode_number;
            document.getElementById('title').value = ep.title || '';
            setServerInputs(parseStoredVideoUrls(ep.video_url));
            
            document.getElementById('formTitle').innerText = "✏️ Edit Episode";
            document.getElementById('submitBtn').innerText = "Update Episode";
            document.getElementById('cancelBtn').style.display = "block";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            document.getElementById('episodeForm').reset();
            document.getElementById('editEpisodeId').value = '';
            setServerInputs(['']);
            document.getElementById('formTitle').innerText = "🎬 Publish Episode";
            document.getElementById('submitBtn').innerText = "Publish Episode";
            document.getElementById('cancelBtn').style.display = "none";
        }

        async function deleteEpisode(id) {
            if (!confirm("Are you sure you want to delete this episode?")) return;
            try {
                const res = await fetch(`/api/episodes/${id}`, { method: 'DELETE' });
                const data = await res.json();
                if (data.success) {
                    alert("Episode deleted successfully!");
                    fetchEpisodes();
                } else {
                    alert("Error: " + (data.error || "Delete failed"));
                }
            } catch (err) {
                alert("Server error during delete!");
            }
        }

        document.getElementById('episodeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const editId = document.getElementById('editEpisodeId').value;
            const animeName = document.getElementById('animeName').value;
            const episodeNumber = document.getElementById('episodeNumber').value;
            const title = document.getElementById('title').value;
            const servers = getCollectedServers();
            const videoUrl = servers.length > 0 ? servers[0].url : '';

            if (!videoUrl) {
                alert("Please enter at least one valid video URL.");
                return;
            }

            const url = editId ? `/api/episodes/${editId}` : '/api/episodes';
            const method = editId ? 'PUT' : 'POST';

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ animeName, episodeNumber, title, videoUrl, servers })
                });
                const data = await res.json();
                if (data.success) {
                    alert(editId ? "Episode updated successfully!" : "Episode published successfully!");
                    resetForm();
                    fetchEpisodes();
                } else {
                    alert("Error: " + (data.error || "Operation failed"));
                }
            } catch (err) {
                alert("Server error!");
            }
        });

        fetchEpisodes();
    </script>
</body>
</html>
