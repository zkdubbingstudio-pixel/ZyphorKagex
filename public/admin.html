<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZK Dubbing Studio - Admin</title>
    <style>
        body {
            background-color: #0d0f17;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: #161b26;
            padding: 25px;
            border-radius: 12px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }
        h2 {
            text-align: center;
            color: #ff2a2a;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-top: 12px;
            font-size: 13px;
            color: #bbb;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            background: #0d0f17;
            border: 1px solid #333;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #e50914;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
        }
        button:hover {
            background: #b20710;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>ZK Dubbing - Admin</h2>
        <form id="episodeForm">
            <label>Anime Name</label>
            <input type="text" id="animeName" required placeholder="e.g. Overlord">
            
            <label>Episode Number</label>
            <input type="text" id="episodeNumber" required placeholder="01">
            
            <label>Episode Title (Optional)</label>
            <input type="text" id="title" placeholder="Episode Title">
            
            <label>Video Stream URL / File Path</label>
            <input type="text" id="videoUrl" required placeholder="https://...">
            
            <button type="submit">Publish Episode</button>
        </form>
    </div>

    <script>
        document.getElementById('episodeForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const animeName = document.getElementById('animeName').value.trim();
            const episodeNumber = document.getElementById('episodeNumber').value.trim();
            const title = document.getElementById('title').value.trim();
            const videoUrl = document.getElementById('videoUrl').value.trim();

            try {
                const response = await fetch('/api/publish-episode', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        animeName,
                        episodeNumber,
                        title,
                        videoUrl
                    })
                });

                const result = await response.json();

                if (result.success) {
                    alert('✅ Episode Successfully Published!\nEpisode ID: ' + result.episodeId);
                    document.getElementById('episodeForm').reset();
                } else {
                    alert('❌ Error: ' + (result.message || 'Unknown error'));
                }
            } catch (err) {
                console.error(err);
                alert('❌ Network Error! Episode publish nahi ho paya.');
            }
        });
    </script>
</body>
</html>
