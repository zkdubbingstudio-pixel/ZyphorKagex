<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitsu Admin Panel - ZK Dubbing Studio</title>
    <style>
        body {
            background-color: #0f0f0f;
            color: #ffffff;
            font-family: Arial, sans-serif;
            padding: 15px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: #1a1a1a;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h2 {
            text-align: center;
            color: #ffcc00;
        }
        label {
            font-size: 14px;
            color: #ccc;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px 0;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background: #0088cc;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background: #006699;
        }
        .episode-item {
            background: #222;
            padding: 10px;
            margin-top: 8px;
            border-radius: 4px;
            border-left: 4px solid #ffcc00;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🎬 Kitsu Admin Panel</h2>
        <form id="episodeForm">
            <label>Anime Name:</label>
            <input type="text" id="animeName" required placeholder="Anime Name">
            
            <label>Episode Number:</label>
            <input type="text" id="episodeNumber" required placeholder="01">
            
            <label>Title (Optional):</label>
            <input type="text" id="title" placeholder="Episode Title">
            
            <label>Video Stream URL / File Path:</label>
            <input type="text" id="videoUrl" required placeholder="https://fembed.co/embed/...">
            
            <button type="submit">Publish Episode</button>
        </form>

        <h3 style="margin-top: 30px; border-bottom: 1px solid #444; padding-bottom: 5px;">📁 Published Episodes List</h3>
        <div id="episodesList">Loading episodes...</div>
    </div>

    <script>
        async function fetchEpisodes() {
            try {
                const res = await fetch('/api/episodes');
                const episodes = await res.json();
                const listDiv = document.getElementById('episodesList');
                
                if (!episodes || episodes.length === 0) {
                    listDiv.innerHTML = "<p>No episodes published yet.</p>";
                    return;
                }

                listDiv.innerHTML = episodes.map(ep => `
                    <div class="episode-item">
                        <strong>${ep.anime_name} - Ep ${ep.episode_number}</strong><br>
                        <small style="color: #aaa;">${ep.title || 'No title'}</small><br>
                        <span style="color: #00aaee; font-size: 11px; word-break: break-all;">${ep.video_url}</span>
                    </div>
                `).join('');
            } catch (err) {
                document.getElementById('episodesList').innerHTML = "<p style='color:red;'>Failed to load episodes.</p>";
            }
        }

        document.getElementById('episodeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const animeName = document.getElementById('animeName').value;
            const episodeNumber = document.getElementById('episodeNumber').value;
            const title = document.getElementById('title').value;
            const videoUrl = document.getElementById('videoUrl').value;

            try {
                const res = await fetch('/api/episodes', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ animeName, episodeNumber, title, videoUrl })
                });
                const data = await res.json();
                if (data.success) {
                    alert("Episode published successfully!");
                    document.getElementById('episodeForm').reset();
                    fetchEpisodes();
                } else {
                    alert("Error: " + (data.error || "Publish failed"));
                }
            } catch (err) {
                alert("Server error during publish!");
            }
        });

        fetchEpisodes();
    </script>
</body>
</html>
